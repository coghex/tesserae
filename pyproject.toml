[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae"
version = "0.1.0"
description = "Tools for modular tabletop play."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[project.scripts]
tesserae = "tesserae.cli:main"

[tool.setuptools.packages.find]
include = ["tesserae*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
